<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>
    <!-- MENU-->
    <!-- navbar - barra de navegacação do bootstrap
      navbar-expand controla a responsividade. a partir de telas lg (large),
      o menu fica aberto/horizontal. abaixo disso, pode ficar recolhido no botão sanduiche
      bg-danger - define a cor de fundo vermelho
      navbar-dark - adapta os textos e icones do navbar para serem utilizados sobre o fundo escuro
      shadow adiciona uma sombra ao elemnto-->
    <nav class="navbar navbar-expand-lg bg-danger navbar-dark shadow">
        <div class="container">
            <!-- navbar-brand - estiliza o elemento como a marca/logo da navbar 
         fw-bold deixa o texto em negrito (fw - font-weight)
         fs-4 define o tamanho da fonte (fs - font-size) vai até o 6-->
            <a class="navbar-brand fw-bold fs-4" href="#">
                Bella Pizza
            </a>
            <!-- navbar toggle - botao responsavel por abrir e fechar o menu em telas maiores
 data-bs-toggle="collapse" Informa que o botão irá mostrar/esconder um elemento
 data-bs-target Indica qual elemento será aberto ou fechado nesse casp procura o elemetno que possui id_"Menu"-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <!-- nabar-toggler-icon Exibe o botao sanduiche-->
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <!-- navbar-nav Organiza a lista como menu de navegação
             ms-auto Adiciona margem automaticamente no lado inicial (start)
             Ou seja empurra o item para a direita (ms - margin-start)-->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio

                        </a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="#pizzas">Pizzas
                            
                        </a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="#sobre">Sobre
                            
                        </a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="#contato">Contato
                            
                        </a>
                    </li>
                </ul>

            </div>
        </div>

    </nav>
    
    <section class="bg-light py-5">

        <div class="container">
        <!-- #row - cria uma linha do sistema de grid do bootstrap.
     align-items-center - centraliza verticalmente os elementos 
     que serao dentro da linha-->
     <div class="row align-items-center">
        <!-- col md 6 cria uma coluna que ocupa 6 das 12 partes do grid a partir
         de telas medias(md)
         como o grid possui 12 colunas
         6+6 = duas colunas 50% do espaco.
         Em telas menores que md , as colunas ficam uma abaixo da outra-->
         <div class="col-md-6">
            <!-- display 4 aplica um tamanho grande de destaque ao texto 
             fw-bold - deixa o texto em negrito-->
             <h1 class="display-4 fw-bold">
                A melhor pizza de Fernandopolis!
             </h1>
             <p class="lead">
                Pizzas artesanais preparadas com igredientes selecionados pelo
                proprio ratatouille e muito sabor.
             </p>
             <!-- btn- aplica a estilização padrão do botão do Bootstrap.
              btn-danger - deixa o botão vermelho
              btn-lg cria um botao de tamanho grande
              lg- large-->
              <a href="#pizzas" class="btn-danger btn-lg">Ver Cardápio</a>
              
         </div>
         <!-- col-md-6 - ocupa as outras 6 colunas do Grid
          text-center- centraliza o conteudo/texto
          mt-4 - Adiciona margem superior
          m=margem
          y=top
          mt-md-0 - a partir de telas md, remove a margem superior
          isso é util porque no celular a imagem ficara abaixo do texto
           e precisara de um espaço entre eles-->
         <div class="col-md-6 text-center mt-4 mt-md-0">
            <!-- img-fluid - torna a imagem responsiva 
             a imagem diminui de acordo com o tamanho disponivel 
             rounded deixa os cantos da imagem arredondados
             shadow adiciona uma sombra-->
             <img src="img.jpg" class="img-fluid rounded shadow" alt="Pizza">
         </div>
        </div>
     </div>
    </section>
    
    </body>

</html>
